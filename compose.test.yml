services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: oauth2_server_bundle
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql
    networks:
      - test

  composer:
    build:
      context: .
      dockerfile: Dockerfile.test
    user: "${TEST_UID:-1000}:${TEST_GID:-1000}"
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      HOME: /tmp
    volumes:
      - .:/app
    command: composer update --no-interaction

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    user: "${TEST_UID:-1000}:${TEST_GID:-1000}"
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONTAINER_CONFIG: Tests/Resources/config/services.xml
      HOME: /tmp
    volumes:
      - .:/app
    networks:
      - test
    command: >
      sh -ec 'cd Tests
      && ../vendor/bin/doctrine orm:schema-tool:drop --force --full-database || true
      && ../vendor/bin/doctrine orm:schema-tool:create
      && cd ..
      && vendor/bin/phpunit --configuration phpunit.xml.dist'

networks:
  test:
    internal: true
